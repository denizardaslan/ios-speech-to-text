# XcodeGen project definition.
# On a Mac:  brew install xcodegen && xcodegen generate && open SesliYaz.xcodeproj
#
# Change these for your own account:
#   - DEVELOPMENT_TEAM  (the Team ID shown in Xcode > Settings > Accounts)
#   - BUNDLE_ID_PREFIX  (must be unique, e.g. com.yourname)
# The App Group ID is derived from the bundle prefix automatically.
# The user-facing app name is APP_DISPLAY_NAME; the target and bundle IDs keep the original "SesliYaz" name.

name: SesliYaz

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: "Y4NCFKA5A4"
    BUNDLE_ID_PREFIX: com.denizardaslan
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).sesliyaz
    APP_DISPLAY_NAME: Voice Type
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SesliYaz:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: SesliYazKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Microphone access is needed to turn your speech into text.
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - sesliyaz
        SesliYazAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: App/SesliYaz.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sesliyaz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SesliYazKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SesliYazAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/SesliYazKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sesliyaz.keyboard
