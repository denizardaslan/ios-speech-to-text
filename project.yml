# XcodeGen proje tanımı.
# Mac'te:  brew install xcodegen && xcodegen generate && open SesliYaz.xcodeproj
#
# Kendi hesabına göre değiştirmen gerekenler:
#   - DEVELOPMENT_TEAM  (Xcode > Settings > Accounts'ta görünen Team ID)
#   - BUNDLE_ID_PREFIX  (benzersiz olmalı, örn. com.adsoyad)
# App Group kimliği bundle prefix'ten otomatik türetilir.

name: SesliYaz

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_PREFIX: com.denizardaslan
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).sesliyaz
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SesliYaz:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: SesliYazKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sesli Yaz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Konuşmanı yazıya çevirmek için mikrofona erişim gerekiyor.
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - sesliyaz
        SesliYazAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: App/SesliYaz.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sesliyaz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SesliYazKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Sesli Yaz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SesliYazAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: tr-TR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/SesliYazKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sesliyaz.keyboard
